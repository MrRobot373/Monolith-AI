# Every push and pull request: typecheck everything; the unit, agent-runtime and API tests (against
# Postgres with pgvector and Valkey, the real agent runtime and Chrome, as root like the Docker
# image so each task runs as its own user); the builds; and the browser suites on a running stack.
# The Docker images are built, and the API image's firewall tested, on the default branch, for
# version tags and by hand (Actions → CI → Run workflow).
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PG: postgres://aatmiq:aatmiq@localhost:5432
  CHROME: /usr/bin/google-chrome

jobs:
  test:
    name: Typecheck, tests and builds
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: aatmiq, POSTGRES_PASSWORD: aatmiq, POSTGRES_DB: aatmiq_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U aatmiq" --health-interval 5s --health-timeout 3s --health-retries 20
      valkey:
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Tools the agent's tests use (command sandbox, Word and Excel libraries)
        run: |
          sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends bubblewrap
          sudo python3 -m pip install -q --break-system-packages python-docx openpyxl
      - run: pnpm install --frozen-lockfile
      # Each Work AI task runs as its own Unix user; it has to reach the checkout (in the runner's
      # home, closed to others by default) the way it reaches /app in the Docker image.
      - name: Let task users reach the checkout
        run: sudo chmod a+x /home/runner
      # '!aatmiq': not the root package (its scripts run turbo over everything again).
      - name: Typecheck
        run: pnpm -r --if-present --filter '!aatmiq' typecheck
      - name: Test databases
        run: |
          psql "$PG/aatmiq_test" -qc "create extension if not exists vector" -c "create database license_test"
          DATABASE_URL="$PG/aatmiq_test" pnpm db:migrate
      - name: Unit tests
        run: pnpm -r --if-present --filter '!aatmiq' --filter '!@aatmiq/api' --filter '!@aatmiq/harness' test
        env:
          LICENSE_TEST_DATABASE_URL: ${{ env.PG }}/license_test
      - name: Agent runtime and API tests (as root)
        run: sudo -E env "PATH=$PATH" pnpm -r --no-bail --filter @aatmiq/harness --filter @aatmiq/api test
        env:
          TEST_DATABASE_URL: ${{ env.PG }}/aatmiq_test
          REDIS_TEST_URL: redis://localhost:6379/5
          BROWSER_PATH: ${{ env.CHROME }}
      - name: Builds
        # The IDE (apps/code) is built inside the API image; see the images job.
        run: pnpm -r --if-present --filter '!aatmiq' --filter '!@aatmiq/code' build

  e2e:
    name: Browser suites
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: aatmiq, POSTGRES_PASSWORD: aatmiq, POSTGRES_DB: aatmiq }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U aatmiq" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: sudo python3 -m pip install -q --break-system-packages python-docx openpyxl
      - name: Let task users reach the checkout
        run: sudo chmod a+x /home/runner
      - run: pnpm install --frozen-lockfile
      - run: npm install --prefix tests/e2e --no-audit --no-fund
      - run: pnpm --filter @aatmiq/web build
      - name: Product suite (chat, documents, projects, admin, health…)
        run: sudo -E env "PATH=$PATH" tests/e2e/run-work.sh
        env:
          E2E_SCRIPT: ${{ github.workspace }}/tests/e2e/full.mjs
          BASE_URL: http://localhost:3300
          LOG_DIR: ${{ github.workspace }}/tests/e2e/results-full
          CHROMIUM_PATH: ${{ env.CHROME }}
          BROWSER_PATH: ${{ env.CHROME }}
      - name: Work AI suite (real agent runtime)
        run: sudo -E env "PATH=$PATH" tests/e2e/run-work.sh
        env:
          CHROMIUM_PATH: ${{ env.CHROME }}
          BROWSER_PATH: ${{ env.CHROME }}
      - name: Screenshots and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            tests/e2e/results*/
          if-no-files-found: ignore

  images:
    name: Docker images
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Room for the images
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile.api -t aatmiq-api:ci .
      - run: docker build -f deploy/Dockerfile.web -t aatmiq-web:ci .
      - name: The API image's user firewall
        run: API_IMAGE=aatmiq-api:ci tests/e2e/run-firewall.sh

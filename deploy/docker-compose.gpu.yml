# A team on one GPU server (docs/10-team-server.md): vLLM serves two open models on one NVIDIA GPU
# with 48 GB (RTX A6000, RTX 6000 Ada, L40S), and Aatmiq registers both at first setup.
#
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.gpu.yml --env-file deploy/.env up -d
#
# Needs the NVIDIA driver and the NVIDIA Container Toolkit on the host. The first start downloads
# the models (about 34 GB) into the `models` volume; `docker compose logs -f vllm vllm-small` shows
# progress. All models here are Apache-2.0.
#
#  - Main model (Chat, Work AI, Code; the default): Qwen3.6-35B-A3B in 4 bits, 25 GB. A mixture of
#    experts (about 3B of its 35B parameters work per token, so it's fast) with mostly linear
#    attention: a token of conversation costs about 20 KB of GPU memory, so its 70% of the GPU
#    holds several hundred thousand tokens shared by everyone working at that moment. It also reads
#    images. "Thinking" is off by default (faster answers for many people); VLLM_THINKING=true turns
#    it on for every request.
#  - Small model (Chat, for quick jobs): Gemma 4 E2B, Google's 4-bit build, 8 GB, 20% of the GPU.
#    It runs with `--profile small` (deploy/team.sh adds it). Leave it out: VLLM_SMALL_URL= (empty)
#    in .env, and give the main model VLLM_GPU_MEMORY=0.90.
#
# Other models: VLLM_MODEL / VLLM_SMALL_MODEL (a Hugging Face repo vLLM supports), their names,
# memory shares and, for their tool-call format, VLLM_TOOL_PARSER (see vLLM's tool calling docs).
services:
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.30.0}
    restart: unless-stopped
    # vLLM's worker processes share memory; Docker's 64 MB default isn't enough.
    ipc: host
    environment:
      # Only needed for gated models.
      HF_TOKEN: ${HF_TOKEN:-}
      # After the first download the server can run without internet: set HF_HUB_OFFLINE=1.
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
    volumes:
      - models:/root/.cache/huggingface
    command:
      - ${VLLM_MODEL:-QuantTrio/Qwen3.6-35B-A3B-AWQ}
      - --served-model-name=${VLLM_MODEL_NAME:-qwen3.6-35b-a3b}
      # The longest single conversation. Longer agent tasks are summarized as they go.
      - --max-model-len=${VLLM_MAX_MODEL_LEN:-65536}
      - --gpu-memory-utilization=${VLLM_GPU_MEMORY:-0.70}
      # Requests answered at once; more wait in vLLM's queue.
      - --max-num-seqs=${VLLM_MAX_SEQS:-32}
      - --enable-auto-tool-choice
      - --tool-call-parser=${VLLM_TOOL_PARSER:-qwen3_coder}
      - --reasoning-parser=${VLLM_REASONING_PARSER:-qwen3}
      - '--default-chat-template-kwargs={"enable_thinking": ${VLLM_THINKING:-false}}'
      # Qwen's recommended sampling without thinking (with VLLM_THINKING=true use 1.0, 0.95 and 0).
      - '--override-generation-config={"temperature": ${VLLM_TEMPERATURE:-0.7}, "top_p": ${VLLM_TOP_P:-0.8}, "top_k": 20, "presence_penalty": ${VLLM_PRESENCE_PENALTY:-1.5}}'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${VLLM_GPU:-0}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 5
      # The first start downloads the model.
      start_period: 60m

  vllm-small:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.30.0}
    profiles: ["small"]
    restart: unless-stopped
    ipc: host
    # Loads after the main model, so the two don't measure GPU memory at the same moment.
    depends_on:
      vllm: { condition: service_healthy }
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
    volumes:
      - models:/root/.cache/huggingface
    command:
      - ${VLLM_SMALL_MODEL:-google/gemma-4-E2B-it-qat-w4a16-ct}
      - --served-model-name=${VLLM_SMALL_MODEL_NAME:-gemma-4-e2b}
      - --max-model-len=${VLLM_SMALL_MAX_MODEL_LEN:-32768}
      - --gpu-memory-utilization=${VLLM_SMALL_GPU_MEMORY:-0.20}
      - --max-num-seqs=${VLLM_MAX_SEQS:-32}
      - --enable-auto-tool-choice
      - --tool-call-parser=${VLLM_SMALL_TOOL_PARSER:-gemma4}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${VLLM_GPU:-0}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30m

  api:
    environment:
      # First setup registers the main model for Chat, Work AI and Code as the default…
      SETUP_MODEL_URL: http://vllm:8000/v1
      SETUP_MODEL: ${VLLM_MODEL_NAME:-qwen3.6-35b-a3b}
      SETUP_MODEL_DISPLAY_NAME: ${VLLM_MODEL_DISPLAY_NAME:-Qwen3.6 35B A3B}
      SETUP_MODEL_CONTEXT: ${VLLM_MAX_MODEL_LEN:-65536}
      SETUP_MODEL_VISION: ${VLLM_MODEL_VISION:-true}
      # …and the small one for Chat (Admin → Models changes either later).
      SETUP_SMALL_MODEL_URL: ${VLLM_SMALL_URL-http://vllm-small:8000/v1}
      SETUP_SMALL_MODEL: ${VLLM_SMALL_MODEL_NAME:-gemma-4-e2b}
      SETUP_SMALL_MODEL_DISPLAY_NAME: ${VLLM_SMALL_MODEL_DISPLAY_NAME:-Gemma 4 E2B (fast)}
      SETUP_SMALL_MODEL_CONTEXT: ${VLLM_SMALL_MAX_MODEL_LEN:-32768}
      # Agent tasks working at once across the organization (Admin → Work AI changes it later).
      SETUP_MAX_RUNNING: ${WORK_MAX_RUNNING:-8}

volumes:
  models:

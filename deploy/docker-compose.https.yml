# HTTPS in front of Aatmiq (docs/10-team-server.md#https), with Caddy: automatic certificates
# from Let's Encrypt, Caddy's own (office networks) or your company's. Set in .env:
#   DOMAIN=aatmiq.yourcompany.com   APP_URL=https://aatmiq.yourcompany.com   CADDY_TLS=…
# (see deploy/caddy/Caddyfile), then:
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.https.yml --env-file deploy/.env up -d
services:
  caddy:
    image: ${CADDY_IMAGE:-caddy:2.11.3}
    restart: unless-stopped
    depends_on: [web]
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
      - "${HTTP_REDIRECT_PORT:-80}:80"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN, the address people open Aatmiq at}
      IDE_DOMAIN: ${IDE_DOMAIN:-}
      CADDY_TLS: ${CADDY_TLS:-internal}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config

  # Only Caddy is reachable from the network; plain HTTP stays inside.
  web:
    ports: !reset []

volumes:
  caddy-data:
  caddy-config:

# Aatmiq: self-hosted stack.
#   cp deploy/.env.example deploy/.env   (then edit it)
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
# Optional local models: add `--profile ollama`. Private web search for Work AI: add `--profile search`
# (then set the SearXNG URL to http://searxng:8080 in Admin → Work AI).
name: aatmiq

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: aatmiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: aatmiq
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aatmiq"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: { context: .., dockerfile: deploy/Dockerfile.api }
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://aatmiq:${POSTGRES_PASSWORD}@postgres:5432/aatmiq
      APP_URL: ${APP_URL:?set APP_URL}
      APP_SECRET: ${APP_SECRET:?set APP_SECRET}
      ALLOW_MOCK_PROVIDER: ${ALLOW_MOCK_PROVIDER:-false}
      OCR_ENABLED: ${OCR_ENABLED:-true}
      # Aatmiq's license public key (from your order email). Without it the server runs in development mode.
      LICENSE_PUBLIC_KEY: ${LICENSE_PUBLIC_KEY:-}
      # Daily check-ins (counts only). Set empty for air-gapped installs.
      LICENSE_SERVER_URL: ${LICENSE_SERVER_URL-https://license.aatmiq.com}
      # Work AI: commands may only change their task folder (Landlock/bubblewrap). Set "off" only on
      # hosts whose kernel has neither; each task still runs as its own Unix user.
      WORK_SANDBOX: ${WORK_SANDBOX:-on}
      # Outgoing email for invitations and password resets. Optional: admins can also set it in
      # Admin → Settings → Email. Example: smtps://user:password@smtp.example.com:465
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes:
      - files:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:4000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build: { context: .., dockerfile: deploy/Dockerfile.web }
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    environment:
      SHOW_MARKETING: "false"
    ports:
      - "${HTTP_PORT:-3000}:3000"

  searxng:
    image: searxng/searxng:latest
    profiles: ["search"]
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-${APP_SECRET}}
      # Listen on IPv4 (the default IPv6 socket fails on hosts without IPv6).
      GRANIAN_HOST: 0.0.0.0
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    # Uncomment for NVIDIA GPUs:
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

volumes:
  pgdata:
  files:
  ollama:
